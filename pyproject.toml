[project]
name = "hm-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black",
    "datamodels",
    "duckdb",
    "duckdb-engine",
    "graphviz",
    "ipykernel",
    "jupyter",
    "meilisearch",
    "notebook",
    "openai",
    "pandas",
    "protobuf",
    "psutil",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "PyPDF2",
    "python-dateutil",
    "python-dotenv",
    "pyyaml",
    "scikit-learn",
    "selenium",
    "snakemake",
    "snakemake-executor-plugin-slurm",
    "spacy",
    "SPARQLWrapper",
    "sqlalchemy==1.4.54",
    "torch",
    "transformers",
    "urllib3",
    "xlrd",
    "xmltodict",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/sources", "src/enrichment", "src/pipelines"]
