[project]
name = "hm-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black",
    "ctranslate2>=4.8.2",
    "duckdb",
    "duckdb-engine",
    "en-core-web-sm",
    "fasttext-wheel>=0.9.2",
    "graphviz",
    "huggingface-hub>=1.31.0",
    "ipykernel",
    "jupyter",
    "notebook",
    "openai",
    "opensearch-py",
    "pandas",
    "protobuf",
    "psutil",
    "psycopg2-binary",
    "pyahocorasick>=2.3.1",
    "pyarrow>=25.0.1",
    "pydantic",
    "pydantic-settings",
    "PyPDF2",
    "python-dateutil",
    "python-dotenv",
    "pyyaml",
    "sacrebleu>=2.6.0",
    "scikit-learn",
    "selenium",
    "sentencepiece>=0.2.2",
    "snakemake",
    "snakemake-executor-plugin-slurm",
    "spacy",
    "SPARQLWrapper",
    "sqlalchemy==1.4.54",
    "torch>=2.10,<2.12",
    "transformers",
    "urllib3",
    "xlrd",
    "xmltodict",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/sources", "src/enrichment", "src/pipelines"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# The cluster's GPU driver is 530 (CUDA 12.1); PyPI's default torch is built for CUDA 13 and can't use it.
# torch >= 2.12 fails to create a CUDA context on driver 530 (cudaErrorDevicesUnavailable); 2.10/2.11 verified working.
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
