[project]
name = "hm-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black",
    "duckdb",
    "duckdb-engine",
    "en-core-web-sm",
    "graphviz",
    "ipykernel",
    "jupyter",
    "notebook",
    "openai",
    "opensearch-py",
    "pandas",
    "protobuf",
    "psutil",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "PyPDF2",
    "python-dateutil",
    "python-dotenv",
    "pyyaml",
    "rapidfuzz>=3.14.6",
    "scikit-learn",
    "selenium",
    "snakemake",
    "snakemake-executor-plugin-slurm",
    "spacy",
    "SPARQLWrapper",
    "sqlalchemy==1.4.54",
    "torch",
    "transformers",
    "urllib3",
    "xlrd",
    "xmltodict",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/sources", "src/enrichment", "src/pipelines"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
